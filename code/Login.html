<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فراهی محصلین په کندهار کی</title>
  <style>
    .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  form {
    display: flex;
    flex-direction: column;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f2f2f2;
  }
  
  h2 {
    text-align: center;
  }
  
  input {
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }
  
  button {
    padding: 10px;
    border: none;
    border-radius: 3px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
  }
  
  button:hover {
    background-color: #45a049;
  }

  body{
    background-image: url(login.jpg);
    background-repeat: no-repeat;
    background-size: cover;
  }
  </style>
</head>
<body>
  <div class="container">
    <form id="login-form" class="form">
      <h2>Login</h2>
      <input type="text" id="login-email" placeholder="Email address" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(event) {
    event.preventDefault();
    var email = document.getElementById("login-email").value;
    var password = document.getElementById("login-password").value;
    var users = JSON.parse(localStorage.getItem("users")) || [];
    var user = users.find(function(u) {
      return u.email === email && u.password === password;
    });
    if (user) {
      alert("Login successful");
      window.location.href = "file:///C:/Users/Obaidullah%20Barakzay/Desktop/web%20final%20project/farah.html#kdru";
    } else {
      alert("Invalid email or password");
      window.location.href = "file:///C:/Users/Obaidullah%20Barakzay/Desktop/web%20final%20project/Login.html";
    }
  });
  </script>
</body>
</html>
